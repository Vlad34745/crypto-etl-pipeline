[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.ipynb"]  # exploratory notebook, not lint-checked

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle, pyflakes, warnings, import order
ignore = ["E501"]  # line length is a soft target, don't fail the build on it

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["I001"]  # sys.path.insert must run before the local import
